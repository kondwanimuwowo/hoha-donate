<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Donations | House of Hope Africa</title>
    <meta
      name="description"
      content="Partnering with House of Hope Africa means standing with vulnerable communities to bring hope, healing and lasting change. Give in Zambian Kwacha with mobile money."
    />
    <meta name="theme-color" content="#fffcf2" />
    <meta property="og:title" content="Donations | House of Hope Africa" />
    <meta
      property="og:description"
      content="Your support helps us expand life-saving programs and uplift families across the nation."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/images/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <img class="logo" src="/images/logo.avif" alt="House of Hope Africa" />
    </header>

    <main>
      <section class="donate" id="donate">
        <div id="donate-intro">
          <h1>Make a difference</h1>
          <p class="lede">
            Change starts with people like you. Your donation helps make a real impact, one action
            at a time. Together, we can do more.
          </p>
        </div>

        <form id="donate-form">
          <fieldset>
            <legend>Amount (ZMW)</legend>
            <div class="options options-amount" id="amounts"></div>
          </fieldset>

          <div class="field" id="other-field" hidden>
            <label for="other-amount">Your amount in Kwacha</label>
            <input id="other-amount" type="number" inputmode="decimal" min="1" max="100000" step="0.01" />
          </div>

          <fieldset>
            <legend>Mobile money network</legend>
            <div class="options options-network" id="networks"></div>
          </fieldset>

          <div class="field">
            <label for="phone">Mobile money number</label>
            <input
              id="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel-national"
              placeholder="0971234567"
              required
            />
          </div>

          <p class="form-error" id="form-error" role="alert" hidden></p>

          <button class="donate-button" id="donate-button" type="submit">Donate</button>
        </form>

        <div class="status-panel" id="status-panel" aria-live="polite" hidden>
          <h1 id="status-title" tabindex="-1"></h1>
          <div class="status-indicator" id="status-indicator" hidden><span></span></div>
          <p id="status-body"></p>
          <p class="status-reference" id="status-reference" hidden></p>
          <button class="secondary-button" id="status-action" type="button" hidden></button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="copyright">© 2026 House of Hope Africa</p>
    </footer>
  </body>
</html>
